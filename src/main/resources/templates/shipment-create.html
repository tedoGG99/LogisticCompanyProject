<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Shipment - Logistics</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="navbar">
    <div class="brand">📦 Logistics Co.</div>
    <a th:href="@{/shipments}">Back to Dashboard</a>
</div>

<div class="login-container" style="height: auto; padding: 4rem 0;">
    
    <div class="login-card" style="max-width: 600px; text-align: left;">
        <h2 style="text-align: center;">Register New Shipment</h2>
        <p class="subtitle" style="text-align: center;">Enter package details below</p>

        <form th:action="@{/shipments/create}" th:object="${shipmentDto}" method="post">
            
            <div class="form-group">
                <label>Sender (Client)</label>
                <select th:field="*{senderId}" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="" disabled selected>Select a client...</option>
                    <option th:each="client : ${clients}" 
                            th:value="${client.id}" 
                            th:text="${client.username} + ' (' + ${client.getFullName()} + ')'"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Receiver Name</label>
                <input type="text" th:field="*{receiverName}" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label>Receiver Username (Optional - for registered users)</label>
                <input type="text" th:field="*{receiverUsername}" placeholder="username123">
            </div>

            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" step="0.1" th:field="*{weight}" required>
            </div>

            <div class="form-group">
                <label>Delivery Type</label>
                <select id="deliveryTypeSelect" th:field="*{deliveryType}" onchange="toggleAddressFields()" required 
                        style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="TO_OFFICE">To Office (Cheaper)</option>
                    <option value="TO_ADDRESS">To Address (Doorstep)</option>
                </select>
            </div>

            <div id="officeField" class="form-group">
                <label>Select Office</label>
                <select th:field="*{targetOfficeId}" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px;">
                    <option th:each="office : ${offices}" 
                            th:value="${office.id}" 
                            th:text="${office.city} + ' - ' + ${office.address}"></option>
                </select>
            </div>

            <div id="addressField" class="form-group" style="display: none;">
                <label>Delivery Address</label>
                <input type="text" th:field="*{targetAddress}" placeholder="Street, City, Zip">
            </div>

            <button type="submit" class="login-btn">Create Shipment</button>
        </form>
    </div>
</div>

<script>
    function toggleAddressFields() {
        const type = document.getElementById("deliveryTypeSelect").value;
        const officeDiv = document.getElementById("officeField");
        const addressDiv = document.getElementById("addressField");

        if (type === "TO_ADDRESS") {
            officeDiv.style.display = "none";
            addressDiv.style.display = "block";
            // Make address required logic if needed
        } else {
            officeDiv.style.display = "block";
            addressDiv.style.display = "none";
        }
    }
</script>

</body>
</html>
