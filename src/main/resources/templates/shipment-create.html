<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Shipment</title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />

    <style>
        .hidden { display: none; }
    </style>
</head>

<body>

<div class="main-container">

    <div class="page-header">
        <a th:href="@{/shipments}" class="btn-back">← Back</a>
        <h1>Create New Shipment</h1>
    </div>

    <div class="form-card">

        <form th:action="@{/shipments/create}" th:object="${shipmentDto}" method="post" id="shipmentForm">

            <!-- =========================
                 SENDER (Username + Email)
            ========================== -->
            <label>Sender (Client):</label>

            <div style="display:flex; gap: 16px; flex-wrap: wrap;">
                <!-- sender username -->
                <div style="flex:1; min-width: 240px;">
                    <select th:field="*{senderId}" id="senderSelect" required>
                        <option value="" disabled selected>Select Client...</option>

                        <option th:each="client : ${clients}"
                                th:value="${client.id}"
                                th:text="${client.username}"
                                th:attr="data-email=${client.email}">
                        </option>
                    </select>

                    <small class="hint">If you are a client, this will be ignored.</small>
                </div>

                <!-- sender email autofill / editable -->
                <div style="flex:1; min-width: 240px;">
                    <input type="email"
                           id="senderEmail"
                           th:field="*{senderEmail}"
                           readonly
                           placeholder="Sender email...">

                    <div style="margin-top: 8px; display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="customSenderEmailToggle" style="width:auto; height:auto;">
                        <label for="customSenderEmailToggle" style="margin:0; font-weight:800;">
                            Use custom email
                        </label>
                    </div>

                    <small class="hint">Auto-filled by default. Enable custom email if needed.</small>
                </div>
            </div>

            <!-- =========================
                 RECEIVER (Registered OR Manual)
            ========================== -->

            <label>Receiver Username (Registered - Optional):</label>
            <select th:field="*{receiverUsername}" id="receiverSelect">
                <option value="">-- Manual Receiver (Guest) --</option>

                <option th:each="user : ${allUsers}"
                        th:value="${user.username}"
                        th:text="${user.username}"
                        th:attr="data-email=${user.email}">
                </option>
            </select>

            <small class="hint">
                Choose registered user or leave empty for manual receiver.
            </small>

            <!-- Manual username (Guest only) -->
            <label>Receiver Username (Manual - Guest):</label>
            <input type="text"
                   th:field="*{receiverManualUsername}"
                   id="receiverManualUsername"
                   placeholder="Enter receiver username...">

            <small class="hint">Fill only if receiver is not registered.</small>

            <!-- Receiver email -->
            <label>Receiver Email:</label>
            <input type="email"
                   th:field="*{receiverEmail}"
                   id="receiverEmail"
                   placeholder="Enter receiver email..."
                   required>

            <div style="display:flex; gap: 16px; flex-wrap: wrap; margin-top: 8px;">
                <div style="flex:1; min-width: 220px;">
                    <label>Receiver Name (Guest):</label>
                    <input type="text" th:field="*{receiverName}">
                </div>

                <div style="flex:1; min-width: 220px;">
                    <label>Receiver Phone:</label>
                    <input type="text" th:field="*{receiverPhone}">
                </div>
            </div>

            <!-- =========================
                 Shipment data
            ========================== -->
            <label>Weight (kg):</label>
            <input type="number" step="0.1" th:field="*{weight}" required>

            <!-- =========================
                 Delivery method
            ========================== -->
            <label>Delivery Method:</label>
            <select th:field="*{deliveryTypeId}" id="deliveryTypeSelect" onchange="toggleInputs()" required>
                <option value="" disabled selected>Select Type...</option>

                <option th:each="type : ${deliveryTypes}"
                        th:value="${type.id}"
                        th:text="${type.typeName}"
                        th:data-requires-office="${type.requiresOffice}">
                </option>
            </select>

            <!-- office -->
            <div id="officeSection" class="hidden">
                <label>Target Office:</label>
                <select th:field="*{targetOfficeId}" id="officeSelect">
                    <option value="" disabled selected>Select Office...</option>
                    <option th:each="office : ${offices}"
                            th:value="${office.id}"
                            th:text="|${office.city} - ${office.address}|">
                    </option>
                </select>
            </div>

            <!-- address -->
            <div id="addressSection" class="hidden">
                <label>Delivery Address:</label>
                <textarea th:field="*{targetAddress}" id="addressInput" rows="2"></textarea>
            </div>

            <div style="margin-top: 16px;">
                <button type="submit" class="btn-sm btn-primary">Create Shipment</button>
            </div>
        </form>

    </div>
</div>

<script>
    function toggleInputs() {
        const select = document.getElementById('deliveryTypeSelect');
        const selectedOption = select.options[select.selectedIndex];

        const requiresOffice = selectedOption.getAttribute('data-requires-office') === 'true';

        const officeSection = document.getElementById('officeSection');
        const addressSection = document.getElementById('addressSection');
        const officeInput = document.getElementById('officeSelect');
        const addressInput = document.getElementById('addressInput');

        if (requiresOffice) {
            officeSection.style.display = 'block';
            addressSection.style.display = 'none';

            officeInput.setAttribute('required', 'required');
            addressInput.removeAttribute('required');
            addressInput.value = "";
        } else {
            officeSection.style.display = 'none';
            addressSection.style.display = 'block';

            officeInput.removeAttribute('required');
            officeInput.value = "";
            addressInput.setAttribute('required', 'required');
        }
    }

    function updateSenderEmail() {
        const senderSelect = document.getElementById("senderSelect");
        const senderEmailInput = document.getElementById("senderEmail");
        const toggle = document.getElementById("customSenderEmailToggle");

        if (!senderSelect || !senderEmailInput || !toggle) return;

        // If custom sender email is enabled -> don't overwrite
        if (toggle.checked) return;

        const selectedOption = senderSelect.options[senderSelect.selectedIndex];
        const email = selectedOption ? selectedOption.getAttribute("data-email") : "";

        senderEmailInput.value = email ? email : "";
    }

    function updateReceiverFields() {
        const receiverSelect = document.getElementById("receiverSelect");
        const receiverEmail = document.getElementById("receiverEmail");
        const manualUsername = document.getElementById("receiverManualUsername");

        if (!receiverSelect || !receiverEmail || !manualUsername) return;

        const selectedValue = receiverSelect.value;

        // Registered selected
        if (selectedValue && selectedValue.trim() !== "") {
            const selectedOption = receiverSelect.options[receiverSelect.selectedIndex];
            const email = selectedOption.getAttribute("data-email");

            receiverEmail.value = email ? email : "";
            receiverEmail.setAttribute("readonly", "readonly");

            manualUsername.value = "";
            manualUsername.setAttribute("readonly", "readonly");
        } else {
            // Manual mode
            receiverEmail.removeAttribute("readonly");
            manualUsername.removeAttribute("readonly");
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        toggleInputs();
        updateSenderEmail();
        updateReceiverFields();

        const senderSelect = document.getElementById("senderSelect");
        const toggle = document.getElementById("customSenderEmailToggle");
        const senderEmailInput = document.getElementById("senderEmail");

        if (senderSelect) {
            senderSelect.addEventListener("change", updateSenderEmail);
        }

        if (toggle && senderEmailInput) {
            toggle.addEventListener("change", function() {
                if (toggle.checked) {
                    senderEmailInput.removeAttribute("readonly");
                    senderEmailInput.focus();
                } else {
                    senderEmailInput.setAttribute("readonly", "readonly");
                    updateSenderEmail();
                }
            });
        }

        const receiverSelect = document.getElementById("receiverSelect");
        if (receiverSelect) {
            receiverSelect.addEventListener("change", updateReceiverFields);
        }
    });
</script>

</body>
</html>
