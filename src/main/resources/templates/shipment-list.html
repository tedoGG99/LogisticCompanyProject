<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Logistics Co.</title>
    
    <link href="/css/dashboard.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

   <nav class="navbar">
        <div class="brand">
            <i class="bi bi-box-seam-fill"></i>&nbsp;Logistics Co.
        </div>

        <div>
            <span style="margin-right: 1rem;">
                Welcome, <span sec:authentication="name">User</span>
            </span>

            <a href="/shipments">My Shipments</a>

            <a href="/reports" th:if="${isStaff}">Reports</a>
            <div class="dropdown" th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}">
    
                <a href="#" class="dropbtn">
                    <i class="bi bi-shield-lock-fill"></i> Admin Panel ▼
                </a>

                <div class="dropdown-content">
                    <a href="/admin/offices">Manage Offices</a>
                    <a href="/admin/users">Manage Users</a>
                    <a href="/offices/create">Add New Office</a> 
                </div>
            </div>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500; font-size:1rem; margin-left:1.5rem;">
                    Logout
                </button>
            </form>
        </div>
    </nav>

    <div class="main-container">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h2>Shipment List</h2>

            <div>
                 <a href="/shipments/create" class="btn-sm btn-primary">
                    <i class="bi bi-plus-lg"></i> New Shipment
                 </a>
            </div>
        </div>

        <div class="table-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Tracking #</th>
                        <th>Sender</th>
                        <th>Receiver</th>
                        <th>Destination</th>
                        <th>Weight</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="shipment : ${shipments}">
                        
                        <td style="font-weight:bold;" th:text="${shipment.trackingNumber}"></td>
                        
                        <td th:text="${shipment.sender.username}"></td>
                        
                        <td>
                            <div th:if="${shipment.receiver != null}" th:text="${shipment.receiver.username}"></div>
                            <div th:if="${shipment.receiver == null}">
                                <span th:text="${shipment.receiverName}"></span><br>
                                <small style="color:#666;" th:text="${shipment.receiverPhone}"></small>
                            </div>
                        </td>

                        <td>
                            <div th:if="${shipment.office != null}" th:text="|Office: ${shipment.office.city}|"></div>
                            <div th:if="${shipment.office == null}" th:text="${shipment.deliveryAddress}"></div>
                        </td>

                        <td th:text="|${shipment.weight} kg|"></td>
                        
                        <td style="color: #28a745; font-weight:bold;" th:text=" | ${shipment.price}|"></td>
                        
                        <td>
                            <span class="badge" 
                                  th:classappend="|badge-${shipment.status.statusName}|"
                                  th:text="${shipment.status.statusName}">
                            </span>
                        </td>
                        
                       <td class="action-cell">
    
                        <div th:if="${#authorization.expression('hasAnyAuthority(''ROLE_ADMIN'', ''ROLE_OFFICE_EMPLOYEE'')')}">

                            <form th:if="${shipment.status.statusName == 'REGISTERED'}" 
                                  th:action="@{/shipments/{id}/status(id=${shipment.id})}" method="post"
                                  style="margin-bottom: 5px;">
                                <input type="hidden" name="status" value="SENT"/>
                                <button type="submit" class="btn-sm" style="background-color: #ffc107; border:none;">
                                    Receive
                                </button>
                            </form>

                            <form th:if="${shipment.status.statusName == 'SENT' and shipment.courier == null}"
                                  th:action="@{/shipments/{id}/assign-courier(id=${shipment.id})}" method="post"
                                  style="display:flex; gap:5px; margin-bottom: 5px;">

                                <select name="courierId" required style="padding: 2px; width: 100px; font-size: 0.8rem;">
                                    <option value="">Select Courier</option>
                                    <option th:each="c : ${couriers}" 
                                            th:value="${c.id}" 
                                            th:text="${c.username}">
                                    </option>
                                </select>
                                <button type="submit" class="btn-sm btn-primary" style="padding: 2px 5px;">Assign</button>
                            </form>

                            <div th:if="${shipment.status.statusName == 'SENT' and shipment.courier != null}" 
                                 style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">
                                 <span>On way: </span> <strong th:text="${shipment.courier.username}"></strong>
                            </div>
                        </div>

                        <div th:if="${#authorization.expression('hasAuthority(''ROLE_COURIER'')')}">

                            <form th:if="${shipment.status.statusName == 'SENT' 
                                         and shipment.courier != null 
                                         and shipment.courier.username == #authentication.name}" 
                                  th:action="@{/shipments/{id}/status(id=${shipment.id})}" method="post"
                                  style="margin-bottom: 5px;">

                                <input type="hidden" name="status" value="DELIVERED"/>
                                <button type="submit" class="btn-sm" style="background-color: #28a745; color: white; border:none;">
                                    Deliver
                                </button>
                            </form>
                        </div>

                        <span th:if="${shipment.status.statusName == 'DELIVERED'}" 
                              class="badge" style="background-color: #d1e7dd; color: #0f5132;">
                            Done
                        </span>

                        <a th:href="@{/shipments/{id}(id=${shipment.id})}" 
                           class="btn-sm btn-secondary" 
                           style="text-decoration:none; margin-left: 5px;">
                           Details
                        </a>

                    </td>
                    </tr>
                    
                    <tr th:if="${#lists.isEmpty(shipments)}">
                        <td colspan="8" style="text-align:center; padding: 2rem; color: #666;">
                            No shipments found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
