<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="/css/dashboard.css" rel="stylesheet">
    
    <style>
        .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
}
.modal-content {
    background: white; padding: 20px; border-radius: 8px; width: 90%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">Admin Panel</div>
        <div>
            <a href="/shipments">Dashboard</a>
            <a href="/admin/offices">Manage Offices</a>
        </div>
    </nav>

    <div class="main-container">
        <h2>All Users</h2>
        <div style="margin-bottom: 20px;">
            <a href="/admin/users/create" class="btn btn-success" style="padding: 5px 15px; text-decoration: none; color: white; background-color: #28a745; border-radius: 4px;">
                + Create New User
            </a>
        </div>
        <div class="table-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Enabled</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td style="font-weight:bold;" th:text="${user.username}">john_doe</td>
                        <td th:text="${user.email}">Missing mail .</td>
                        <td>
                            <span class="badge" style="background-color:#e2e3e5; color:#333;" 
                                  th:text="${user.role.role}">ROLE_CLIENT</span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" style="color:green; font-weight:bold;">Active</span>
                            <span th:if="${!user.enabled}" style="color:red;">Disabled</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" style="color:#007bff; text-decoration:underline;">Edit</a>
                            &nbsp;|&nbsp;
                            <button class="btn-sm" 
                                    style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;"

                                    th:data-id="${user.id}"
                                    th:data-username="${user.username}"

                                    onclick="openDeleteModal(this.getAttribute('data-id'), this.getAttribute('data-username'))">
                                Delete
                            </button>
                            <!--<a"style="color:#dc3545; text-decoration:underline;">Delete</a>-->
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<div id="deleteModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        
        <div class="modal-header" style="justify-content: center; border-bottom: none;">
            <h3 style="color: #dc3545;">⚠ Confirm Deletion</h3>
        </div>
        
        <div class="modal-body">
            <p>Are you sure you want to disable this user?</p>
            <h4 id="deleteUserName" style="color: #333;"></h4>
            <p style="font-size: 0.9em; color: #666;">They will no longer be able to log in.</p>
        </div>
        
        <div class="modal-footer" style="justify-content: center; gap: 10px; border-top: none; padding-top: 0;">
            <button onclick="closeDeleteModal()" 
                    class="btn-sm" style="background-color: #6c757d; color: white;">
                Cancel
            </button>

            <form id="deleteForm" method="post" action="">
                <button type="submit" class="btn-sm" style="background-color: #dc3545; color: white;">
                    Yes, Delete User
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function openDeleteModal(userId, username) {
        // 1. Set the username text
        document.getElementById('deleteUserName').innerText = username;
        
        // 2. Set the form action dynamically to point to the correct ID
        // Example result: /admin/users/5/delete
        var form = document.getElementById('deleteForm');
        form.action = '/admin/users/' + userId + '/delete';
        
        // 3. Show the modal
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }

    // Close if clicking outside the box
    window.onclick = function(event) {
        var modal = document.getElementById('deleteModal');
        if (event.target == modal) {
            closeDeleteModal();
        }
    }
</script>
</body>
</html>
