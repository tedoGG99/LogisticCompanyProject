
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>

<div class="login-container" style="height: auto; padding: 4rem 0;">
    <div class="login-card">
        <h2>Create Account</h2>
        <p class="subtitle">Join our logistics network</p>

        <div th:if="${error}" class="error-message">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" th:field="*{username}" required>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" required>
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" th:field="*{firstName}" required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" th:field="*{lastName}" required>
            </div>

            <div class="form-group">
                <label>Account Type</label>
                <select id="roleSelect" th:field="*{roleName}" onchange="toggleOffice()" 
                        style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px;">
                    
                    <option th:each="role : ${roles}"
                            th:value="${role.role}"
                            th:text="${role.role}"></option>
<!--                    <option value="client">Client</option>
                    <option value="office_employee">Office Employee</option>
                    <option value="courier">Courier</option>-->
                </select>
            </div>

            <div id="officeDiv" class="form-group" style="display:none;">
                <label>Select Your Office</label>
                <select th:field="*{officeId}" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="" disabled selected>Choose office...</option>
                    <option th:each="office : ${offices}" 
                            th:value="${office.id}" 
                            th:text="${office.city} + ' - ' + ${office.name}"></option>
                </select>
            </div>

            <button type="submit" class="login-btn">Register</button>
        </form>

        <div class="footer">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </div>
    </div>
</div>

<script>
    function toggleOffice() {
        var role = document.getElementById("roleSelect").value;
        var officeDiv = document.getElementById("officeDiv");
        
        // If role is 'office_employee', show the dropdown
        if (role === 'office_employee') {
            officeDiv.style.display = 'block';
        } else {
            officeDiv.style.display = 'none';
        }
    }
    
    // Run on page load in case of error reload
    document.addEventListener("DOMContentLoaded", function() {
        toggleOffice();
    });
</script>

</body>
</html>
