<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Office</title>
    
    <link href="/css/dashboard.css" rel="stylesheet">
    
    <style>
        .form-row { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        .form-input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }
        .form-input:focus { border-color: #007bff; outline: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            Logistics Co.
        </div>
        <div>
            <a href="/shipments">Back to Dashboard</a>
        </div>
    </nav>

    <div class="main-container">
        
        <div class="table-card" style="max-width: 500px; margin: 0 auto;">
            <h2 style="margin-top: 0; margin-bottom: 1.5rem;">Add New Office Branch</h2>
            
            <form th:action="@{/offices/create}" th:object="${office}" method="post">
                
                <div class="form-row">
                    <label class="form-label">Office Name</label>
                    <input type="text" th:field="*{name}" class="form-input" 
                           placeholder="e.g. Sofia Central" required>
                </div>

                <div class="form-row">
                    <label class="form-label">City</label>
                    <input type="text" th:field="*{city}" class="form-input" 
                           placeholder="e.g. Sofia" required>
                </div>

                <div class="form-row">
                    <label class="form-label">Physical Address</label>
                    <input type="text" th:field="*{address}" class="form-input" 
                           placeholder="e.g. 5th Avenue, Bl. 10" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                    Create Office
                </button>
                
            </form>
        </div>
    </div>

</body>
</html>
