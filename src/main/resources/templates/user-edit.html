<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="/css/dashboard.css" rel="stylesheet">
    <style>
        .form-row { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .form-select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; background-color: white; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">Admin Panel</div>
        <div><a href="/admin/users">Back to List</a></div>
    </nav>

    <div class="main-container">
        <div class="table-card" style="max-width: 600px; margin: 0 auto;">
            <h2>Edit User</h2>
            
            <form th:action="@{/admin/users/update}" th:object="${user}" method="post">
                
                <input type="hidden" th:field="*{id}" />

                <div class="form-row">
                    <label class="form-label">Username</label>
                    <input type="text" th:field="*{username}" class="form-input" required>
                </div>

                <div class="form-row">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-input" required>
                </div>

                <div class="form-row">
                    <label class="form-label">Role</label>
                    <select th:field="*{role}" class="form-select">
                        <option th:each="role : ${allRoles}" 
                                th:value="${role.id}" 
                                th:text="${role.role.replace('ROLE_', '')}">
                        </option>
                    </select>
                </div>

                <div class="form-row">
                    <label class="form-label">Assigned Office (For Employees)</label>
                    <select th:field="*{office}" class="form-select">
                        <option value="">-- No Office --</option>
                        <option th:each="office : ${allOffices}" 
                                th:value="${office.id}" 
                                th:text="|${office.name} (${office.city})|">
                        </option>
                    </select>
                </div>

                <div class="form-row" style="margin-top: 20px;">
                    <label style="cursor: pointer;">
                        <input type="checkbox" th:field="*{enabled}" />
                        <span style="font-weight: 600; margin-left: 8px;">Account Enabled</span>
                    </label>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">
                    Save Changes
                </button>
                
            </form>
        </div>
    </div>

</body>
</html>
